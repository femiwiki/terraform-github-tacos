---
name: terraform-github-tacos
description: >-
  Plan OpenTofu or Terraform in a pull request, apply it once a GitHub
  environment approves, and only then merge.
author: femiwiki
branding:
  icon: check-circle
  color: orange
inputs:
  step:
    description: >-
      Which part of the flow this call is: plan, changes, cost, pending,
      apply, result, gate or merge. The README says which job each one goes in.
    required: true
  workspace:
    description: The workspace this job plans or applies. Used by plan, changes, cost and apply.
    default: ""
  changes:
    description: Whether the plan has changes, "true" or "false". Used by changes.
    default: ""
  plan-json:
    description: Path to the plan as JSON, such as `tofu show -json` writes. Used by changes, cost and result.
    default: ""
  plan-text:
    description: >-
      Path to the plan as text, such as dflook's `text_plan_path`. Shown folded
      in the job summary. Used by changes and result.
    default: ""
  infracost-api-key:
    description: >-
      An Infracost API key. Without one, cost does nothing. Only price lookups
      are sent to Infracost, never the plan. Used by cost.
    default: ""
  outcome:
    description: The apply step's outcome, `steps.<id>.outcome`. Used by result.
    default: ""
  approver:
    description: Who approved, the apply step's `approver` output. Used by result.
    default: ""
  workspaces:
    description: >-
      A JSON list of workspaces to apply, taking the place of the ones found in
      this run. Used by pending, for a workflow_dispatch run.
    default: ""
  needs:
    description: The gate's `toJSON(needs)`. Used by gate.
    default: ""
  may-skip:
    description: Jobs among `needs` that may be skipped, separated by spaces. Used by gate.
    default: apply
  require-up-to-date:
    description: >-
      "true" to refuse a pull request behind its base when planning and
      applying. Off by default: the apply makes a fresh plan and applies it
      only when it matches the approved one, so a change on the base to the
      same workspace stops it anyway. Used by plan and apply.
    default: "false"
  merge-method:
    description: squash, merge or rebase. Used by merge.
    default: squash
  github-token:
    description: The token to call the GitHub API with.
    default: ${{ github.token }}
outputs:
  apply:
    description: From changes, "true" when the plan has something to apply.
    value: ${{ steps.changes.outputs.apply }}
  workspaces:
    description: From pending, the JSON list of workspaces waiting for approval.
    value: ${{ steps.pending.outputs.workspaces }}
  approver:
    description: From apply, who approved the deployment.
    value: ${{ steps.apply.outputs.approver }}
  result:
    description: >-
      From result, one of applied, no-changes, failed, cancelled or skipped.
    value: ${{ steps.result.outputs.result }}
runs:
  using: composite
  steps:
    - name: Unknown step
      if: >-
        !contains(fromJSON('["plan","changes","cost","pending","apply","result","gate","merge"]'), inputs.step)
      shell: bash
      env:
        STEP: ${{ inputs.step }}
      run: |
        echo "::error::step must be plan, changes, cost, pending, apply, result, gate or merge, not '$STEP'."
        exit 1

    - if: inputs.step == 'plan'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKSPACE: ${{ inputs.workspace }}
        REQUIRE_UP_TO_DATE: ${{ inputs.require-up-to-date }}
      run: '"$GITHUB_ACTION_PATH/scripts/plan.sh"'

    - id: changes
      if: inputs.step == 'changes'
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        CHANGES: ${{ inputs.changes }}
        PLAN_JSON: ${{ inputs.plan-json }}
        PLAN_TEXT: ${{ inputs.plan-text }}
      run: '"$GITHUB_ACTION_PATH/scripts/changes.sh"'

    - if: inputs.step == 'cost'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKSPACE: ${{ inputs.workspace }}
        PLAN_JSON: ${{ inputs.plan-json }}
        INFRACOST_API_KEY: ${{ inputs.infracost-api-key }}
      run: '"$GITHUB_ACTION_PATH/scripts/cost.sh"'

    - id: pending
      if: inputs.step == 'pending'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKSPACES: ${{ inputs.workspaces }}
      run: '"$GITHUB_ACTION_PATH/scripts/pending.sh"'

    - id: apply
      if: inputs.step == 'apply'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKSPACE: ${{ inputs.workspace }}
        REQUIRE_UP_TO_DATE: ${{ inputs.require-up-to-date }}
      run: '"$GITHUB_ACTION_PATH/scripts/apply.sh"'

    - id: result
      if: inputs.step == 'result'
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        OUTCOME: ${{ inputs.outcome }}
        PLAN_JSON: ${{ inputs.plan-json }}
        PLAN_TEXT: ${{ inputs.plan-text }}
        APPROVER: ${{ inputs.approver }}
      run: '"$GITHUB_ACTION_PATH/scripts/result.sh"'

    - if: inputs.step == 'gate'
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        MAY_SKIP: ${{ inputs.may-skip }}
      run: '"$GITHUB_ACTION_PATH/scripts/gate.sh"'

    - if: inputs.step == 'merge'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        METHOD: ${{ inputs.merge-method }}
      run: '"$GITHUB_ACTION_PATH/scripts/merge.sh"'
