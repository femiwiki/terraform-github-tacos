---
name: terraform-github-tacos
description: >-
  Plan OpenTofu or Terraform in a pull request, plan again once it merges, and
  apply, by default once a GitHub environment approves.
author: femiwiki
branding:
  icon: check-circle
  color: orange
inputs:
  step:
    description: >-
      Which part of the flow this call is: plan, changes, pending, apply,
      result, gate, merge or collapse. The README says which job each one goes in.
    required: true
  workspace:
    description: The workspace this job plans or applies. Used by plan, changes and apply.
    default: ""
  changes:
    description: Whether the plan has changes, "true" or "false". Used by changes.
    default: ""
  plan-json:
    description: Path to the plan as JSON, such as `tofu show -json` writes. Used by changes and result.
    default: ""
  plan-text:
    description: >-
      Path to the plan as text, such as dflook's `text_plan_path`. Shown folded
      in the job summary. Used by changes and result.
    default: ""
  outcome:
    description: The apply step's outcome, `steps.<id>.outcome`. Used by result.
    default: ""
  approver:
    description: Who approved, the apply step's `approver` output. Used by result.
    default: ""
  workspaces:
    description: >-
      A JSON list of workspaces to apply, taking the place of the ones found in
      this run. Used by pending, for a workflow_dispatch run.
    default: ""
  auto-apply:
    description: >-
      Workspaces that apply without an approval, separated by spaces, like
      HCP Terraform's auto apply. Their environments have no required
      reviewers; any other workspace's environment must have some. Used by
      pending.
    default: ""
  needs:
    description: The gate's `toJSON(needs)`. Used by gate.
    default: ""
  may-skip:
    description: Jobs among `needs` that may be skipped, separated by spaces. Used by gate.
    default: apply
  require-up-to-date:
    description: >-
      "true" to refuse a pull request behind its base when planning and
      applying. Off by default: the apply makes a fresh plan and applies it
      only when it matches the approved one, so a change on the base to the
      same workspace stops it anyway. Used by plan and apply.
    default: "false"
  apply-before-merge:
    description: >-
      "true" to apply a pull request before it merges, approving the apply in
      the pull request's run and merging once it succeeds. Off by default: the
      pull request only plans, and the run for the push to the default branch
      plans again and applies. Used by pending, apply and merge.
    default: "false"
  merge-method:
    description: squash, merge or rebase. Used by merge.
    default: squash
  github-token:
    description: The token to call the GitHub API with.
    default: ${{ github.token }}
outputs:
  apply:
    description: From changes, "true" when the plan has something to apply.
    value: ${{ steps.changes.outputs.apply }}
  workspaces:
    description: From pending, the JSON list of workspaces waiting for approval.
    value: ${{ steps.pending.outputs.workspaces }}
  approver:
    description: From apply, who approved the deployment.
    value: ${{ steps.apply.outputs.approver }}
  result:
    description: >-
      From result, one of applied, no-changes, failed, cancelled or skipped.
    value: ${{ steps.result.outputs.result }}
runs:
  using: composite
  steps:
    - name: Unknown step
      if: >-
        !contains(fromJSON('["plan","changes","pending","apply","result","gate","merge","collapse"]'), inputs.step)
      shell: bash
      env:
        STEP: ${{ inputs.step }}
      run: |
        echo "::error::step must be plan, changes, pending, apply, result, gate, merge or collapse, not '$STEP'."
        exit 1

    - if: inputs.step == 'plan'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKSPACE: ${{ inputs.workspace }}
        REQUIRE_UP_TO_DATE: ${{ inputs.require-up-to-date }}
      run: '"$GITHUB_ACTION_PATH/scripts/plan.sh"'

    - id: changes
      if: inputs.step == 'changes'
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        CHANGES: ${{ inputs.changes }}
        PLAN_JSON: ${{ inputs.plan-json }}
        PLAN_TEXT: ${{ inputs.plan-text }}
      run: '"$GITHUB_ACTION_PATH/scripts/changes.sh"'

    - id: pending
      if: inputs.step == 'pending'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKSPACES: ${{ inputs.workspaces }}
        AUTO_APPLY: ${{ inputs.auto-apply }}
        APPLY_BEFORE_MERGE: ${{ inputs.apply-before-merge }}
      run: '"$GITHUB_ACTION_PATH/scripts/pending.sh"'

    - if: inputs.step == 'pending' && inputs.apply-before-merge == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR: ${{ github.event.pull_request.number }}
        APPLY_BEFORE_MERGE: ${{ inputs.apply-before-merge }}
        WORKSPACES: ${{ steps.pending.outputs.workspaces }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { default: stack } = await import(`${process.env.ACTION_PATH}/scripts/stack.ts`)
          await stack({ github, core, env: process.env })

    - id: apply
      if: inputs.step == 'apply'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKSPACE: ${{ inputs.workspace }}
        REQUIRE_UP_TO_DATE: ${{ inputs.require-up-to-date }}
        APPLY_BEFORE_MERGE: ${{ inputs.apply-before-merge }}
      run: '"$GITHUB_ACTION_PATH/scripts/apply.sh"'

    - id: result
      if: inputs.step == 'result'
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        OUTCOME: ${{ inputs.outcome }}
        PLAN_JSON: ${{ inputs.plan-json }}
        PLAN_TEXT: ${{ inputs.plan-text }}
        APPROVER: ${{ inputs.approver }}
      run: '"$GITHUB_ACTION_PATH/scripts/result.sh"'

    - if: inputs.step == 'gate'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        NEEDS: ${{ inputs.needs }}
        MAY_SKIP: ${{ inputs.may-skip }}
      with:
        script: |
          const { default: gate } = await import(`${process.env.ACTION_PATH}/scripts/gate.ts`)
          await gate({ core, env: process.env })

    - if: inputs.step == 'merge'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR: ${{ github.event.pull_request.number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        METHOD: ${{ inputs.merge-method }}
        APPLY_BEFORE_MERGE: ${{ inputs.apply-before-merge }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { default: merge } = await import(`${process.env.ACTION_PATH}/scripts/merge.ts`)
          await merge({ github, core, env: process.env })

    - if: inputs.step == 'collapse'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR: ${{ github.event.pull_request.number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { default: collapse } = await import(`${process.env.ACTION_PATH}/scripts/collapse.ts`)
          await collapse({ github, core, env: process.env })
