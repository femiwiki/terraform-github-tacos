---
name: test
on:
  workflow_call:
permissions: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  # Runs the action itself, which the unit tests cannot: whether action.yml
  # finds each script and passes it the inputs
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./
        with:
          step: gate
          needs: '{"plan": {"result": "success"}, "apply": {"result": "skipped"}}'

      - id: failing
        uses: ./
        continue-on-error: true
        with:
          step: gate
          needs: '{"plan": {"result": "failure"}}'

      - name: The gate failed on a failed job
        if: steps.failing.outcome != 'failure'
        run: exit 1

      - name: Write a plan with one resource to create
        run: |
          echo '{"resource_changes": [{"change": {"actions": ["create"]}}]}' > "$RUNNER_TEMP/plan.json"

      - id: changes
        uses: ./
        with:
          step: changes
          workspace: test
          changes: "true"
          plan-json: ${{ runner.temp }}/plan.json

      - id: result
        uses: ./
        with:
          step: result
          workspace: test
          outcome: success
          plan-json: ${{ runner.temp }}/plan.json

      - name: The outputs came through
        env:
          APPLY: ${{ steps.changes.outputs.apply }}
          RESULT: ${{ steps.result.outputs.result }}
        run: |
          echo "apply=$APPLY result=$RESULT"
          [ "$APPLY" = true ] && [ "$RESULT" = applied ]

  collapse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # This pull request has no plan comments, so reading is all it does
      - uses: ./
        with:
          step: collapse

  # Without apply-before-merge, a pull request's run must not offer an apply
  after-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - id: pending
        uses: ./
        with:
          step: pending

      - name: pending listed nothing to apply
        env:
          WORKSPACES: ${{ steps.pending.outputs.workspaces }}
        run: |
          echo "workspaces=$WORKSPACES"
          [ "$WORKSPACES" = '[]' ]

      - id: apply
        uses: ./
        continue-on-error: true
        with:
          step: apply
          workspace: test

      - name: apply refused the pull request
        if: steps.apply.outcome != 'failure'
        run: exit 1

      - uses: ./
        with:
          step: merge

  # This repository's preview environment has no required reviewers, so it
  # stands in for an auto-apply workspace
  auto-apply:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      # The pending step reads the pull request for its stack
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - id: unlisted
        uses: ./
        continue-on-error: true
        with:
          step: pending
          apply-before-merge: "true"
          workspaces: '["preview"]'

      - name: pending refused an environment without reviewers
        if: steps.unlisted.outcome != 'failure'
        run: exit 1

      - id: listed
        uses: ./
        with:
          step: pending
          apply-before-merge: "true"
          workspaces: '["preview"]'
          auto-apply: preview

      - name: pending let it through once listed
        env:
          WORKSPACES: ${{ steps.listed.outputs.workspaces }}
        run: |
          echo "workspaces=$WORKSPACES"
          [ "$WORKSPACES" = '["preview"]' ]

      - id: missing
        uses: ./
        continue-on-error: true
        with:
          step: pending
          apply-before-merge: "true"
          workspaces: '["no-such-environment"]'
          auto-apply: no-such-environment

      - name: pending refused a missing environment even when listed
        if: steps.missing.outcome != 'failure'
        run: exit 1
