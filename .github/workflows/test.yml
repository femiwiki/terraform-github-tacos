---
name: test
on:
  workflow_call:
permissions: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  # Runs the action itself, which the unit tests cannot: whether action.yml
  # finds the script and passes it the inputs
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./
        with:
          step: gate
          needs: '{"plan": {"result": "success"}, "apply": {"result": "skipped"}}'

      - id: failing
        uses: ./
        continue-on-error: true
        with:
          step: gate
          needs: '{"plan": {"result": "failure"}}'

      - name: The gate failed on a failed job
        if: steps.failing.outcome != 'failure'
        run: exit 1
