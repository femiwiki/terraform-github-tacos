---
name: lint
on:
  workflow_call:
permissions: {}
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - run: shellcheck -x scripts/*.sh

  tofu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: dflook/tofu-fmt-check@7615b224655cdd667f6e82f6cf94534a2fd80f9a  # v3.1.0
        with:
          path: .

      - uses: dflook/tofu-validate@1b67c8ac7ef50109c9ca019fd9cd4a4b6fd62915  # v3.1.0
        with:
          path: .

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: chaotic-ground/wikven/actions/bake@79c58df9b0fd9a92143c3cd76e0e677f9de10d45  # v1.2.0
        with:
          source: docs
          output: dist

      # Fails on a source page Translate cannot read; a translation that is behind is only annotated
      - uses: chaotic-ground/wikven/actions/check-translations@79c58df9b0fd9a92143c3cd76e0e677f9de10d45  # v1.2.0
        with:
          source: docs
