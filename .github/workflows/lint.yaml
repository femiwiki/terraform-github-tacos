---
name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - run: shellcheck -x scripts/*.sh

  tofu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: dflook/tofu-fmt-check@7615b224655cdd667f6e82f6cf94534a2fd80f9a  # v3.1.0
        with:
          path: .

      - uses: dflook/tofu-validate@1b67c8ac7ef50109c9ca019fd9cd4a4b6fd62915  # v3.1.0
        with:
          path: .
